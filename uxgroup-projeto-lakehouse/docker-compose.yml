# Ambiente local completo: Postgres (metadados do Airflow) + Airflow.
#
# Não há MinIO, MongoDB ou qualquer outro serviço de armazenamento: as três
# camadas vivem no Snowflake, e tudo o mais roda local e open-source
# (Princípio I). O único serviço remoto do projeto é a conta trial do Snowflake.

x-airflow-comum: &airflow-comum
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PYTHONPATH: /opt/projeto
    DBT_PROFILES_DIR: /opt/projeto/dbt_bets
    # Diretório dos lotes dentro do contêiner. A DAG passa este valor às CLIs.
    BETS_DATA_DIR_CONTAINER: /opt/dados/lotes
  # As credenciais do Snowflake chegam pelo .env, nunca pelo compose
  # versionado (Princípio VIII).
  env_file:
    - .env
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./generator:/opt/projeto/generator
    - ./ingestion:/opt/projeto/ingestion
    - ./common:/opt/projeto/common
    - ./dbt_bets:/opt/projeto/dbt_bets
    - ${BETS_DATA_DIR:-./dados}:/opt/dados/lotes
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-comum
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname admin --lastname admin \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-comum
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-comum
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs:
