name: CI

# GitHub Actions no plano gratuito (Princípio I).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint Python
        run: ruff check generator ingestion common tests snowflake_setup

      # A suíte padrão roda sem credenciais: os testes que exigem Snowflake
      # estão marcados com `requires_snowflake` e são excluídos por `addopts`.
      # Nenhuma etapa do CI toca em recurso cobrado.
      - name: Testes (sem Snowflake)
        run: pytest

      - name: Validar o projeto dbt
        run: |
          pip install "dbt-core>=1.8,<2" "dbt-snowflake>=1.8,<2"
          cd dbt_bets && dbt parse --profiles-dir .
        env:
          # Valores neutros: `dbt parse` valida Jinja, refs e o grafo sem abrir
          # conexão. Nenhum deles é credencial.
          SNOWFLAKE_ACCOUNT: conta-de-ci
          SNOWFLAKE_USER: usuario-de-ci
          SNOWFLAKE_PASSWORD: sem-valor
          SNOWFLAKE_ROLE: papel-de-ci
          SNOWFLAKE_WAREHOUSE: wh-de-ci
          SNOWFLAKE_DATABASE: BETS

      - name: Validar a sintaxe da DAG
        run: python -m py_compile airflow/dags/pipeline_bets.py

  segredos:
    name: Nenhuma credencial versionada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Princípio VIII: credencial versionada é incidente permanente, porque o
      # histórico do Git não esquece.
      - name: Varredura de credenciais
        run: |
          if git grep -nE "SNOWFLAKE_(PASSWORD|USER|ACCOUNT)[[:space:]]*=[[:space:]]*[^[:space:]\"']" \
               -- . ':!*.env.example' ':!.github/workflows/*'; then
            echo "ERRO: credencial encontrada no repositório"
            exit 1
          fi
          echo "nenhuma credencial versionada"

      - name: .env não pode estar versionado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERRO: .env está versionado"
            exit 1
          fi
          echo ".env fora do versionamento"
